server {
    listen 80;
    server_name _;

    # Ruta raíz → redirige a /planfy/
    location = / {
        return 301 /planfy/;
    }

    # Sirve la app Angular bajo /planfy/
    location /planfy/ {
        alias /usr/share/nginx/html/planfy/;
        try_files $uri $uri/ /planfy/index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
