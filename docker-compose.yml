services:
  postgres:
    image: postgres:16
    container_name: planfy_postgres
    environment:
      POSTGRES_DB: planfy
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5444:5432"
    volumes:
      - planfy_data:/var/lib/postgresql/data
    networks:
      - planfy_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d planfy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/planfy-backend
    container_name: planfy_backend
    ports:
      - "8008:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/planfy
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin_pass
    networks:
      - planfy_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend/planfyApp
    container_name: planfy_frontend
    ports:
      - "4201:80"
    depends_on:
      - backend
    networks:
      - planfy_network
    restart: unless-stopped

volumes:
  planfy_data:
    driver: local

networks:
  planfy_network:
    driver: bridge
